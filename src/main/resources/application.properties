spring.application.name=mangoa

# ==========================================
# CONFIGURACIÓN DE JWT
# ==========================================
# Clave secreta HMAC en Base64 de al menos 256 bits (32+ caracteres)
application.security.jwt.secret-key=${JWT_SECRET}
# Expiración en milisegundos (86400000 ms = 24 horas)
application.security.jwt.expiration=86400000

# ==========================================
# CONFIGURACIÓN DE OAUTH2 / GOOGLE LOGIN
# ==========================================
spring.security.oauth2.client.registration.google.client-id=TU_CLIENT_ID_OBTENIDO.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=TU_CLIENT_SECRET_OBTENIDO
spring.security.oauth2.client.registration.google.scope=email,profile